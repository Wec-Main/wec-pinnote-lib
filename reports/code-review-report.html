<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEC Pinnote Code Review</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f0f2f5;--text:#1b1f24;--muted:#5b6470;--border:#dde1e6;
  --accent:#2f5bd3;--crit:#8e1b2e;--crit-bg:#fbe7ea;--high:#b3261e;--high-bg:#fdeceb;--med:#8a5a00;--med-bg:#fff4dc;
  --low:#1f6f43;--low-bg:#e5f4ec;--rv:#5a4fcf;--rv-bg:#eceaff;--ok:#1f6f43;--fail:#b3261e;--nr:#5b6470;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418;--surface:#1a1e24;--surface-2:#222831;--text:#e7eaee;--muted:#a0a9b4;--border:#2e3540;
    --accent:#7aa2ff;--crit:#ff8fa1;--crit-bg:#3a1820;--high:#ff9a92;--high-bg:#3b1a18;--med:#f2c26b;--med-bg:#35290f;
    --low:#7fd3a4;--low-bg:#15301f;--rv:#b3aaff;--rv-bg:#26224a;--ok:#7fd3a4;--fail:#ff9a92;--nr:#a0a9b4;
  }
}
:root[data-theme="dark"]{
  --bg:#111418;--surface:#1a1e24;--surface-2:#222831;--text:#e7eaee;--muted:#a0a9b4;--border:#2e3540;
  --accent:#7aa2ff;--crit:#ff8fa1;--crit-bg:#3a1820;--high:#ff9a92;--high-bg:#3b1a18;--med:#f2c26b;--med-bg:#35290f;
  --low:#7fd3a4;--low-bg:#15301f;--rv:#b3aaff;--rv-bg:#26224a;--ok:#7fd3a4;--fail:#ff9a92;--nr:#a0a9b4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:.88em}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:15px;margin:16px 0 8px}
.sub{color:var(--muted);margin:0}
section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin:16px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px}
.card .n{font-size:28px;font-weight:700;line-height:1.1}
.card .k{color:var(--muted);font-size:13px}
.card.sev-High{border-left:4px solid var(--high)} .card.sev-Critical{border-left:4px solid var(--crit)}
.card.sev-Medium{border-left:4px solid var(--med)} .card.sev-Low{border-left:4px solid var(--low)}
.card.rv{border-left:4px solid var(--rv)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.big{font-size:15px;padding:6px 14px}
.s-Critical{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.s-High{background:var(--high-bg);color:var(--high);border-color:var(--high)}
.s-Medium{background:var(--med-bg);color:var(--med);border-color:var(--med)}
.s-Low{background:var(--low-bg);color:var(--low);border-color:var(--low)}
.st-Open{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.st-RV{background:var(--rv-bg);color:var(--rv);border-color:var(--rv)}
.blocked{background:var(--high-bg);color:var(--high);border-color:var(--high)}
.attention{background:var(--med-bg);color:var(--med);border-color:var(--med)}
.clear{background:var(--low-bg);color:var(--low);border-color:var(--low)}
.neutral{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.r-Passed{color:var(--ok)} .r-Failed{color:var(--fail)} .r-NotRun,.r-NotApplicable{color:var(--nr)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);border:1px solid var(--border)}
.bar span{display:block;height:100%}
.note{color:var(--muted);font-size:13px}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input,select,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:0}
button{cursor:pointer} button:hover{border-color:var(--accent)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.count{font-size:13.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
details.f{border:1px solid var(--border);border-radius:10px;background:var(--surface)}
details.f>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:72px 90px 1fr;gap:10px;align-items:start}
details.f>summary::-webkit-details-marker{display:none}
details.f[open]>summary{border-bottom:1px solid var(--border)}
.fid{font-weight:700;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding-top:3px}
.ftitle{font-weight:600}
.fmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.fmeta .loc{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.fbody{padding:12px 14px;display:grid;gap:10px}
.fbody h4{margin:0 0 2px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fbody p{margin:0;white-space:pre-wrap;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}
ol,ul{margin:6px 0;padding-left:22px}
li{margin:3px 0}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px}
.theme{font-size:13px}
@media (max-width:760px){
  .filters{grid-template-columns:1fr 1fr}
  .filters label:first-child{grid-column:1/-1}
  details.f>summary{grid-template-columns:64px 1fr}
  details.f>summary .sevcol{grid-column:2;grid-row:1}
  details.f>summary .main{grid-column:1/-1}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
}
@media print{
  body{background:#fff;color:#000;font-size:11pt}
  .wrap{max-width:none;padding:0}
  section{border:none;padding:0;margin:14px 0;break-inside:auto}
  .no-print{display:none!important}
  details.f{break-inside:avoid;border-color:#bbb}
  details.f>summary{grid-template-columns:60px 80px 1fr}
  .card{break-inside:avoid}
  a{color:#000}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>WEC Pinnote Code Review</h1>
      <p class="sub">Production-readiness review of <span class="mono">wec-pinnote-lib</span> and <span class="mono">wec-pinnote-api</span></p>
    </div>
    <div class="no-print" style="display:flex;gap:8px">
      <button type="button" id="themeBtn" class="theme" aria-label="Toggle colour theme">Theme: auto</button>
      <button type="button" id="printBtn">Print</button>
    </div>
  </header>

  <section id="overview" aria-labelledby="h-ov"><h2 id="h-ov">1. Review overview</h2><div id="ovBody"></div></section>
  <section id="summary" aria-labelledby="h-sum"><h2 id="h-sum">2. Summary dashboard</h2><div id="sumBody"></div></section>
  <section id="status" aria-labelledby="h-st"><h2 id="h-st">3. Overall review status</h2><div id="stBody"></div></section>
  <section id="findings" aria-labelledby="h-f">
    <h2 id="h-f">4. Findings</h2>
    <div class="filters no-print" role="search">
      <label>Search<input id="q" type="search" placeholder="Text, file, ID…" autocomplete="off"></label>
      <label>Severity<select id="fSev"><option value="">All severities</option></select></label>
      <label>Category<select id="fCat"><option value="">All categories</option></select></label>
      <label>Project<select id="fProj"><option value="">All projects</option></select></label>
      <label>Status<select id="fStat"><option value="">All statuses</option><option>Open</option><option>Requires Verification</option></select></label>
    </div>
    <div class="toolbar no-print">
      <span class="count" id="fCount" aria-live="polite"></span>
      <span style="display:flex;gap:8px"><button type="button" id="expandAll">Expand all</button><button type="button" id="collapseAll">Collapse all</button><button type="button" id="resetF">Reset filters</button></span>
    </div>
    <div class="list" id="fList"></div>
  </section>
  <section id="verification" aria-labelledby="h-v"><h2 id="h-v">5. Verification results</h2><div id="vBody"></div></section>
  <section id="plan" aria-labelledby="h-p"><h2 id="h-p">6. Action plan</h2><div id="pBody"></div></section>
</div>
<script id="review-data" type="application/json">{"items":[{"id":"LIB-01","p":"wec-pinnote-lib","s":"High","st":"Open","c":"Authentication","f":"src/components/AnnotationToolbar/AnnotationToolbar.tsx","l":212,"t":"Host-authenticated mode leaves the toolbar and mode buttons disabled","pr":"Toolbar, AnnotationModeButton, AnnotationToggleButton and AnnotationVisibilityToggle all gate on `const loggedOut = !activeAccount`. `activeAccount` only comes from built-in stored sessions; a host `getAuthToken` never sets it. The provider computes `authenticated = hostAuthenticated || activeAccount !== null` (AnnotationProvider.tsx:81) but these controls never read it, and ToolbarAuthControl returns null in host mode, so no login is offered either.","ev":"AnnotationToolbar.tsx:212, AnnotationModeButton.tsx:48, AnnotationToggleButton.tsx:12, AnnotationVisibilityToggle.tsx:26 all use `!activeAccount`. Triggered when `config.getAuthToken` is supplied and localStorage has no leftover built-in session.","im":"Annotate/flow mode, comments list, Draft Board, Settings, visibility menu and refresh are unusable for host-authenticated integrations, contradicting README “Host-authenticated mode”.","fx":"Gate these controls on `useAnnotationAuth().authenticated` (or an equivalent selector) instead of `activeAccount`.","vf":"Render the provider with `getAuthToken` and empty storage; click the mode button and Comments button and assert they act. Add a DOM test."},{"id":"LIB-02","p":"wec-pinnote-lib","s":"High","st":"Open","c":"Stale data","f":"src/components/Settings/ProjectsTab.tsx","l":296,"t":"Activating/adding a project version in Settings never reaches the running widget","pr":"`useProjectVersioning` calls `onVersionChanged?.()` after add/activate, but the only caller (ProjectsTab) never passes it. The provider exposes `reloadCurrentProjectVersion` for exactly this purpose but nothing in src calls it, and the shared-fetch entry stays cached while subscribed.","ev":"grep: `reloadCurrentProjectVersion` is defined (AnnotationProvider.tsx:158,730,763; AnnotationContext.ts:32-36) and never invoked; ProjectVersionsPanel.tsx:19,49 accepts onVersionChanged; ProjectsTab mounts it without the prop.","im":"After switching the current version, annotation/tag/flow reads and writes keep using the previous projectVersionId until remount — new annotations are written to the wrong version.","fx":"Pass `onVersionChanged={reloadCurrentProjectVersion}` from ProjectsTab (read from context); also call it after version-settings updates.","vf":"Mocked-API DOM test: activate v2 in Settings, assert GET /projects/{id} is refetched and context projectVersionId changes; manually check projectVersionId on the next create request."},{"id":"LIB-03","p":"wec-pinnote-lib","s":"High","st":"Open","c":"Undo/redo","f":"src/components/WecFlow/FlowCanvas.tsx","l":283,"t":"Escape during a node/resize/bend drag keeps dragging and floods undo history","pr":"Canvas Escape calls `startDrag.cancel()` (the canvas's own pan/box-select drag only) and `engine.cancelInteraction()`, which sets interactionDepth to 0 and restores the graph. The node/resize/edge-bend drags use their own usePointerDrag instances whose window listeners stay attached, so subsequent pointermove calls `setNodePositions` → `commit()`, which pushes a history entry per frame because depth is 0.","ev":"FlowCanvas.tsx:283-286; flowEngine.ts:319-323 (`commit` pushes history when interactionDepth === 0) and :344-350 (`cancelInteraction`); useNodeDrag.ts:46-93.","im":"Node snaps back then keeps following the pointer; ~60 undo entries/second evict the 100-entry history, destroying real undo steps; node can still be spliced into an edge on release.","fx":"Register active drags (their abandon callbacks) in the flow context and cancel them on Escape before `cancelInteraction()`, or have cancelInteraction emit an event drag hooks listen to.","vf":"DOM test: pointerdown on node, move past threshold, Escape, move ×5, pointerup; assert listeners removed and one undo restores the original state."},{"id":"LIB-04","p":"wec-pinnote-lib","s":"High","st":"Open","c":"Host integration","f":"src/hooks/useEscapeKey.ts","l":24,"t":"Widget swallows every Escape keypress on the host page while enabled","pr":"AnnotationOverlay registers `useEscapeKey(handler)` without an `active` flag, so a layer is always on the escape stack while the layer is mounted. The hook listens on `document` in the capture phase and calls `event.stopPropagation()` before running the handler; the handler then returns early when not in placement mode.","ev":"useEscapeKey.ts:17-25 (capture listener, unconditional stopPropagation for top layer); AnnotationOverlay.tsx:75 (no `active` argument); layer mounted whenever `config.enabled`.","im":"Host-app modals, dropdowns and menus that close on Escape (React handlers, target/bubble listeners) stop working whenever the widget is enabled, even when idle.","fx":"Pass `active = placing` from AnnotationOverlay; in useEscapeKey only stopPropagation when the handler reports it handled the key.","vf":"In the demo host add an Escape handler on a host dialog; confirm it fires with the provider enabled and idle."},{"id":"LIB-05","p":"wec-pinnote-lib","s":"High","st":"Open","c":"Stale data","f":"src/hooks/useSharedFetch.ts","l":121,"t":"invalidateSharedFetch + reload orphans subscribers; Flow list never shows create/rename/delete","pr":"`invalidateSharedFetch` deletes the cache entry even while it has subscribers. `reload()` then finds no existing entry, starts a new one with an empty subscriber set, and `notifySubscribers` notifies nobody; the settled entry is then evicted. The mounted hook's `owner` keeps pointing at the old entry.","ev":"useSharedFetch.ts:121-130 (`invalidateSharedFetch` deletes unconditionally), :100-111 (`reload` copies subscribers only from an existing entry); FlowListPanel.tsx:49-54 calls invalidate then reload after every mutation.","im":"Creating, renaming or deleting a flow appears to do nothing until the panel remounts.","fx":"Do not delete entries that have subscribers (mark stale and refetch into the same subscriber set), or let reload fall back to the hook's own owner subscribers. Short-term: FlowListPanel should call `reload()` only.","vf":"Hook test: mount with key K, call invalidateSharedFetch(K) then reload(); assert new data is delivered."},{"id":"LIB-06","p":"wec-pinnote-lib","s":"High","st":"Open","c":"Correctness","f":"src/utils/elementResolver.ts","l":92,"t":"Anchor resolver rejects unique name / data-* matches, so those annotations lose their element","pr":"When a stored selector matches exactly one element, it is only accepted if `getElementLabel(match) === elementIdentifier`. For `input[name=…]` and `[data-name]`/`[data-field]` selectors, `generateSelector` stores the raw attribute value as the identifier, while `getElementLabel` returns aria-label, associated \u003clabel>, placeholder or text first. The fallbacks (data-annotation-id, getElementById on Document root only, findByLabel) also miss, so resolution returns null. Scoped `#id` anchors fail the same way because getElementById is only tried on a Document root.","ev":"elementResolver.ts:92 label cross-check; selectorGenerator.ts:134,143 identifier = attribute value; getElementLabel elementResolver.ts:150-180 prefers placeholder over name. Existing DOM tests use `\u003cinput name=\"email\"/>` without placeholder/label, so they pass.","im":"Annotations on common form fields (e.g. `\u003cinput name=\"email\" placeholder=\"Your email\">`) or data-name elements become unresolved immediately after creation; combined with the orphaned-pin hiding behaviour (separate finding), their pins disappear.","fx":"Skip the label cross-check for id/attribute-based selectors (only apply it to nth-of-type path selectors), or store the label separately from the identifier and compare like with like.","vf":"Add DOM tests: name+placeholder input, data-name element with text, scoped #id with a label; assert resolveElement returns the element."},{"id":"LIB-07","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Packaging","f":"package.json","l":18,"t":"CommonJS entry dist/index.js is parsed as ESM because the package is \"type\": \"module\"","pr":"Vite emits the CJS entry as `index.js` (vite.config.ts fileName) while chunks use `.cjs`. With `\"type\": \"module\"`, Node treats `dist/index.js` as ESM.","ev":"Verified locally on a scratch build (Node v24.11.0): `import('./index.js')` → “exports is not defined in ES module scope”; `require('./index.js')` returned a module with 0 exports. `main`/`exports.require` point at ./dist/index.js (package.json:18,25).","im":"Any consumer resolving the `require` condition (CJS SSR, Jest in CJS mode, older bundler configs) gets a broken or empty module. ESM `import` consumers are unaffected.","fx":"Emit the CJS entry as `index.cjs`, point `main` and `exports[\".\"].require` at it; optionally add CJS type declarations.","vf":"`node -e \"require('wec-pinnote-lib')\"` from a CJS consumer; run publint / @arethetypeswrong/cli."},{"id":"LIB-08","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Authorization (UI)","f":"src/components/AnnotationLayer.tsx","l":405,"t":"Any user can drag and resize other users' tag pins","pr":"onGeometryChange/onGeometryCommit are passed unconditionally; TagPin enables drag and resize handles purely on onGeometryChange, while `canEdit` only gates the edit/remove buttons.","ev":"AnnotationLayer.tsx:405-406; TagPin.tsx:84,211.","im":"Non-owners can reposition others' tags; persistence depends on server enforcement (not verified for annotation-tags geometry).","fx":"Pass geometry callbacks only when the viewer can edit the tag.","vf":"Log in as a non-owner contributor and attempt drag/resize."},{"id":"LIB-09","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Accessibility","f":"src/components/EpicFlow/EpicColumn.tsx","l":76,"t":"Keyboard users cannot activate Edit/Delete buttons on EpicFlow cards","pr":"The card's onKeyDown preventDefaults Enter/Space for bubbled events from nested buttons, cancelling their native click and selecting the card instead.","ev":"EpicColumn.tsx:76-81; UserStoryColumn.tsx:83-88.","im":"Edit/Delete are unreachable by keyboard.","fx":"Return early when `event.target !== event.currentTarget`.","vf":"Tab to “Edit epic”, press Enter; modal must open."},{"id":"LIB-10","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Correctness","f":"src/components/EpicFlow/EpicFlowPanel.tsx","l":319,"t":"Epic picker in “Edit user story” is shown but its value is ignored","pr":"UserStoryFormModal shows the Epic select in edit mode, but the save handler destructures out epicId and PATCHes only title/description; the contract's PATCH does not accept epicId.","ev":"UserStoryFormModal.tsx:98-107; EpicFlowPanel.tsx:319-330; api-contract.md:344-351.","im":"Users “move” a story to another epic, get a success message, and nothing moves.","fx":"Hide/disable the picker in edit mode, or add reassignment to the API.","vf":"Edit a story, change epic, save, reload; check the story's epic."},{"id":"LIB-11","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Data loss","f":"src/components/EpicFlow/NotesPanel.tsx","l":63,"t":"EpicFlow Notes edit drafts are overwritten by live updates","pr":"The draft-initialising effect depends on `[editing, title, description]`, so an SSE update or reload that changes the target resets both drafts mid-edit.","ev":"NotesPanel.tsx:63-71.","im":"In-progress notes are silently lost when a collaborator edits the same epic/story.","fx":"Initialise drafts only on the editing false→true transition.","vf":"Edit Notes, update the same epic from another session; draft must survive."},{"id":"LIB-12","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Error handling","f":"src/components/Settings/useResourceTable.ts","l":148,"t":"Non-validation save errors (409/500) are shown behind the open modal","pr":"Errors other than 400 go to a 4 s auto-dismiss notice rendered in the tab body under the modal scrim; the user-create path also drops validation details.","ev":"useResourceTable.ts:148-150; OrganizationsTab.tsx:101-108; ProjectsTab.tsx:154-161; UserManagementPanel.tsx:184-186, 251-253.","im":"Duplicate slug/email or server errors leave the modal open with no visible error; users retry blindly.","fx":"Render a form-level error inside the dialog; set field errors on user create failures.","vf":"Mock 409 on POST /organizations; assert the error text is inside role=dialog."},{"id":"LIB-13","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Correctness","f":"src/components/TagPin/TagPin.tsx","l":93,"t":"Dragging an element-attached tag pin does not move it","pr":"Drag only patches fallbackX/fallbackY, but computePinPosition ignores fallbacks whenever the selector resolves; AnnotationLayer's positions memo key uses only `id:selector`.","ev":"TagPin.tsx:93-105; positioning.ts:25-45; AnnotationLayer.tsx:31-33, :209-236.","im":"Pin snaps back after drag while a PATCH with a meaningless fallback change is still sent.","fx":"Update relativeX/Y from the element rect during drag (or detach on drag) and include geometry in the memo key.","vf":"Manual drag in the demo; unit test of drag → position pipeline."},{"id":"LIB-14","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Data integrity","f":"src/components/UserManagement/UserFormModal.tsx","l":77,"t":"User form hides project assignments not in the fetched project list but still submits them","pr":"projectIds are seeded from user.projects, but options come from the actor's organization's projects; MultiSelect renders chips only for matching options, so other IDs are invisible yet saved.","ev":"UserFormModal.tsx:77-92, :297-307; MultiSelect.tsx:52-53.","im":"Admins cannot see or remove cross-org memberships; field reads “No projects assigned” while memberships exist.","fx":"Merge user.projects into options and fetch the target user's organization projects.","vf":"Edit a user with a cross-org project as super_admin; chip should be visible."},{"id":"LIB-15","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Pagination","f":"src/components/UserManagement/UserManagementPanel.tsx","l":230,"t":"Deleting the only row on the last page leaves an empty table","pr":"After delete, reload uses the unchanged page; TablePagination clamps only the displayed page, never calling onPageChange.","ev":"UserManagementPanel.tsx:101, :230-250; TablePagination.tsx:60-61. Same pattern in AuditHistoryPanel and dashboard visit tables.","im":"Table shows “No users match your search” while the pager shows a different page, until the user clicks a page.","fx":"Clamp page state when a load returns 0 rows with total > 0 and page > 1.","vf":"Mock fetchUsers returning total 20, users [] for offset 20; assert re-request at offset 10."},{"id":"LIB-16","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Performance","f":"src/context/AnnotationProvider.tsx","l":220,"t":"Every page-annotation change triggers a full project-wide annotation refetch","pr":"A 400 ms debounced `reloadAllAnnotations()` runs on every `annotations` reference change, including every SSE event from other users and scope resets.","ev":"AnnotationProvider.tsx:220-230.","im":"N connected clients × each event = N unpaginated GET /annotations?projectId= calls.","fx":"Refetch only after local mutations, or patch allAnnotations in place from the stream.","vf":"Count network calls while another user comments."},{"id":"LIB-17","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Correctness","f":"src/hooks/useAnnotationPresence.ts","l":8,"t":"Clicking a comments-list card for another page can close the list and open nothing","pr":"Presence resolves anchors for all project annotations without checking pageKey; revealAnnotation sets selectedId to an id absent from the page-scoped list, and the provider effect immediately clears it.","ev":"useAnnotationPresence.ts:8-16; AnnotationListPanel.tsx:43-49,105; AnnotationProvider.tsx:243-247, 691-713.","im":"Cards for other-page annotations whose selector also matches here (shared header/nav) look clickable but do nothing.","fx":"Require `annotation.pageKey === pageKey` for presence, or navigate / show a “go to page” hint.","vf":"Create an annotation on a shared header on page A, open list on page B, click the card."},{"id":"LIB-18","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Focus/keyboard","f":"src/hooks/useComboboxList.ts","l":83,"t":"Escape inside selects, mention menu or inline edits closes the whole modal/thread instead","pr":"Modal and thread-panel escape layers are document capture listeners that stopPropagation, so React onKeyDown handlers on SearchableSelect/MultiSelect lists, MentionTextarea menus, comment edit and reply-target never see Escape.","ev":"useEscapeKey.ts:17-28; useComboboxList.ts:83-88 (React onKeyDown Escape); UserStoryFormModal.tsx:43; AnnotationThreadPanel.tsx:63-66; MentionTextarea.tsx:175-195. ColorPicker.tsx:56 already registers its own layer correctly.","im":"Pressing Escape to close a dropdown discards the whole form (typed title/notes lost); in a thread it closes the panel instead of closing the mention menu or cancelling an edit.","fx":"Register open menus/edit modes as their own escape layers via `useEscapeKey(close, open)` (as ColorPicker does).","vf":"DOM test: open the Epic select in the story modal, press Escape; assert modal still mounted and list closed. Same for `@` mention menu in a thread."},{"id":"LIB-19","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Data loss","f":"src/hooks/useFlowDocument.ts","l":230,"t":"Unsaved or failed flow edits are discarded silently on navigation, close or Reload","pr":"No beforeunload guard exists; Back/Close unmount the editor even when saveState is pending/error; the unmount flush reports failures via setSaveError on an unmounted component (no caller passes onSaveFailed); the error banner offers only Reload, which drops pending changes.","ev":"useFlowDocument.ts:137-170, :230-237; WecFlowPanel.tsx:73; FlowDocumentEditor.tsx:108-113; FlowEditor.tsx:89-102; grep finds no `beforeunload` in src.","im":"Edits in the 1.2 s debounce window are lost on tab close; failed final saves (409/400/network) are invisible; Reload after a transient error discards work.","fx":"Add beforeunload while dirty/in-flight/error; confirm Back/Close when unsaved; surface unmount-flush failures; offer Retry for non-409 errors.","vf":"Hook tests with a rejecting saveFlowDocument: unmount and assert failure is reported; assert beforeunload listener exists while pending."},{"id":"LIB-20","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Sensitive data","f":"src/hooks/useSharedFetch.ts","l":70,"t":"Shared fetch keeps the previous key's data after logout or account switch","pr":"When the key becomes null the effect returns early and `dataRef` keeps the last value; when the key changes to a pending entry only `loadingRef` is set. useAllProjectAnnotations and project/tags fetches therefore show the previous account's data.","ev":"useSharedFetch.ts:56-73; useAllProjectAnnotations.ts:22-29 (key null on logout); AnnotationToolbar.tsx:481 renders `allAnnotations.length` even when logged out.","im":"Logged-out toolbar shows the previous user's annotation count; after an account switch, account B briefly sees account A's project-wide annotations/tags (roles may differ).","fx":"Reset dataRef/errorRef whenever the key changes, including to null.","vf":"Hook test: rerender with key → null and key → K2 (pending); assert data === null."},{"id":"LIB-21","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Performance","f":"src/hooks/useSseStream.ts","l":130,"t":"SSE stream is closed and fully resynced about every 50 seconds","pr":"After each ticket fetch a timer fires at `expiresInSeconds*1000 - 10000` and closes a healthy EventSource, then reconnects. Tickets only matter at connect time (server deletes on redeem). The open handler calls `resync()` on every reopen because `openedOnce` stays true.","ev":"useSseStream.ts:130-146 (scheduleTicketRefresh closes source), :169-176 (resync on reopen); server SSE_TICKET_TTL_SECONDS = 60; resync → useAnnotations.retry → full list refetch; EpicFlow uses the same path.","im":"Per tab and per stream: one ticket POST, a new SSE connection and a full list refetch every ~50 s; connection-state flips to “reconnecting”; Last-Event-ID replay becomes pointless.","fx":"Remove the proactive ticket-refresh timer; mint tickets only on reconnect after error; only resync when replay is impossible or the server asks. Add a heartbeat watchdog instead.","vf":"Fake-timer test with mocked EventSource: advance 5 min, assert one EventSource and zero onResync calls; check Network tab in a browser."},{"id":"LIB-22","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Realtime","f":"src/hooks/useSseStream.ts","l":188,"t":"Client ignores the server's `resync` SSE event (cross-module contract gap)","pr":"The client only listens for domain event types and `replay-failed`. The API writes `event: resync` after its Postgres LISTEN connection reconnects (stream.controller.ts:187-192), and the contract documents it; EventSource drops unlistened named events.","ev":"useSseStream.ts:188-194; wec-pinnote-api/src/controllers/stream.controller.ts:187-192; api-contract.md “Live updates (SSE)”.","im":"Events missed during a backend LISTEN outage are never applied (currently masked by the 50 s reconnect in the finding above; becomes visible once that is fixed).","fx":"Add `addEventListener(\"resync\", () => resync())`, or have the server replay from its cursor itself.","vf":"Unit test: dispatch a `resync` MessageEvent and assert onResync is called."},{"id":"LIB-23","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Data correctness","f":"src/utils/applyStreamEvent.ts","l":45,"t":"Live events from other project versions are merged into the current view","pr":"The stream is scoped only to project+page (server ndicator is shown for every node type.","ev":"flowEngine.ts:691-706, :708-749 (rollback at :739); useNodeDrag.ts:78-85; ContextMenu.tsx:228-236.","im":"A→B dragged End onto edge gives A→End with B disconnected; connection loss is silent.","fx":"Validate both new connections with canConnect before removing anything; hide the drop indicator for invalid splices; wrap in begin/endInteraction.","vf":"Unit tests for insertNodeOnEdge(edge,'end') and insertExistingNodeOnEdge(edge,endId) leaving A→B intact."},{"id":"LIB-26","p":"wec-pinnote-lib","s":"Medium","st":"Open","c":"Testing","f":"test/","l":1,"t":"Critical async/UI behaviour in the library has no tests","pr":"No tests cover useSseStream, useAuthSessions/renewal, withUnauthorizedRetry, useSharedFetch, useFlowDocument (debounce, revision, 409, unmount flush), useAnnotations optimistic flows/rollback, drag hooks, escape layering, host-auth toolbar gating, Settings/UserManagement flows or a package-exports smoke test.","ev":"test/ contains unit tests for pure helpers (34 files); several confirmed defects here (SSE churn, sharedFetch, Escape, CJS entry) would be caught by small hook/DOM tests.","im":"Regressions in auth, realtime and persistence paths ship undetected.","fx":"Add hook tests with fake timers/mocked EventSource, DOM tests for escape/drag, and a require/import smoke test of the built package.","vf":"Coverage report for the listed modules."},{"id":"LIB-27","p":"wec-pinnote-lib","s":"Low","st":"Open","c":"Tooling","f":"eslint.config.js","l":10,"t":"`npm run lint` fails on built demo artifacts","pr":"ESLint ignores only `examples/demo/dist`, not `example_v2/demo/dist`.","ev":"Lint run: 1,773 errors, all in example_v2/demo/dist/assets/*.js; src has 0 errors and 2 warnings.","im":"Lint gate is red for reasons unrelated to source, hiding real regressions.","fx":"Ignore `**/dist` (and example_v2) in eslint.config.js.","vf":"Re-run `npm run lint`; only src warnings remain."},{"id":"LIB-28","p":"wec-pinnote-lib","s": es and dashboard sections","pr":"activeAccount.token is in the deps/keys of useResourceTable, useDashboardFetch, AuditHistoryPanel and useAnalyticsStream.","ev":"useAuthSessions.ts:241-255 replaces the token on renewal; useDashboardFetch.ts:55; AuditHistoryPanel.tsx:119; useAnalyticsStream.ts:187.","im":"Periodic bursts of refetches and SSE reconnects.","fx":"Depend on account id and read the token via a getter.","vf":"Observe network across a renewal."},{"id":"LIB-58","p":"wec-pinnote-lib","s":"Low","st":"Requires Verification","c":"Sensitive data","f":"src/components/UserManagement/GeneratedPasswordModal.tsx","l":21,"t":"Generated password modal can be dismissed by Escape/scrim click and is shown unmasked","pr":"The one-time password can be lost with a stray click; it is revealed by default and copied without clipboard clearing. No logging/persistence was found.","ev":"GeneratedPasswordModal.tsx:21-22; PasswordField.tsx:27.","im":"Admin must reset again; shoulder-surfing risk.","fx":"Disable scrim/Escape dismissal or confirm before closing; mask by default.","vf":"Product decision on UX."},{"id":"LIB-59","p":"wec-pinnote-lib","s":"Low","st":"Requires Verification","c":"Performance","f":"src/components/WecFlow/EdgeRenderer.tsx","l":46,"t":"All edges re-render on every drag frame near a connection","pr":"Module-global drop-target and hover stores produce new snapshots per move; every EdgeItem subscribes. Stores are shared across mounted editors.","ev":"EdgeRenderer.tsx:46-71, 97.","im":"Frame drops on large flows.","fx":"Per-edge selectors; scope stores per FlowProvider.","vf":"React Profiler during node drag."},{"id":"LIB-60","p":"wec-pinnote-lib","s":"Low","st":"Requires Verification","c":"Pointer handling","f":"src/hooks/flowchart/usePointerDrag.ts","l":73,"t":"pointercancel is treated as a completed drop","pr":"pointercancel routes to onEnd(moved=true), committing moves/splices; tag pins lack touch-action:none so touch drags likely cancel.","ev":"usePointerDrag. ,"fx":"Lazy-load panels internally or expose separate entry points.","vf":"Inspect bundle graph of a consumer."},{"id":"LIB-64","p":"wec-pinnote-lib","s":"Low","st":"Requires Verification","c":"Security","f":"src/services/httpClient.ts","l":30,"t":"Raw bearer token is broadcast in a global window CustomEvent","pr":"`wpn:unauthorized` events carry `{ token }` on window, readable by any script on the host page.","ev":"httpClient.ts:30-37.","im":"In host-auth mode the library exposes host tokens to third-party scripts (usually just-rejected tokens, but not always).","fx":"Dispatch a non-secret identifier or use a module-level emitter.","vf":"Confirm whether host integrations rely on the detail payload."},{"id":"LIB-65","p":"wec-pinnote-lib","s":"Low","st":"Requires Verification","c":"Resilience","f":"src/services/tagsApi.ts","l":18,"t":"Only annotation/projectVersions/users services retry on 401","pr":"tags, flow, organizations, epicFlow, annotationTags, analytics, audit and stream APIs surface the first 401 directly; Settings/Dashboard fetches use the raw token.","ev":"withUnauthorizedRetry used only in annotationApi.ts, projectVersionsApi.ts, usersApi.ts.","im":"Intermittent user-visible 401 errors around token rotation.","fx":"Move retry into the shared request() path.","vf":"Expire a token and exercise each panel."},{"id":"LIB-66","p":"wec-pinnote-lib","s":"Low","st":"Requires Verification","c":"Input validation","f":"src/utils/flowchart/serialization.ts","l":80,"t":"Flow documents and flow-pin responses from the server are not validated","pr":"parseFlow does not check dangling edges/self-loops/limits; node ids like “constructor” break `positions[n.id]` lookups; fetchFlowPins results are dereferenced as nested anchors while create sends flat fields.","ev":"serialization.ts:80-130; flowEngine.ts:397-405; AnnotationLayer.tsx:32,310,348; flowApi.ts:147-150.","im":"Malformed data can crash rendering or become unsaveable.","fx":"Validate on parse; use Map/Object.hasOwn; f the target's projects are within the admin's projects (else 403 or super_admin only); avoid returning plaintext for such users.","vf":"Route test: admin on [P1], contributor on [P1,P2]; password reset must return 403."},{"id":"API-03","p":"wec-pinnote-api","s":"High","st":"Open","c":"Infrastructure","f":"src/events/eventBus.ts","l":79,"t":"Postgres LISTEN connections ignore DB_SSL, keepAlive and application_name","pr":"Both event buses create `new pg.Client({ connectionString })`, while the pool adds `ssl: { rejectUnauthorized: true }` when DB_SSL=require (production default). URLs built from DB_HOST/DB_* carry no sslmode.","ev":"eventBus.ts:79; analyticsEventBus.ts:82; db/pool.ts:4-16; config/env.ts:68, 88.","im":"On a TLS-only database the LISTEN connection fails and retries forever, so all realtime and analytics live updates stop (readiness only reports “degraded”); otherwise event payloads travel unencrypted.","fx":"Build LISTEN clients from the same config helper as createPool (ssl, keepAlive, application_name).","vf":"Unit test asserting client config includes ssl when DB_SSL=require; staging check against TLS-only Postgres."},{"id":"API-04","p":"wec-pinnote-api","s":"High","st":"Open","c":"Tenant isolation","f":"src/repositories/organizations.repo.ts","l":257,"t":"Moving a project to another organization leaves its content and memberships in the old organization","pr":"`updateProject` sets `projects.organization_id` from the draft (projectUpdateSchema = projectDraftSchema incl. organizationId), but annotations, tags, epics, flows, pins and stream_events keep their own organization_id with no cascade, and user_projects rows are untouched.","ev":"organizations.repo.ts:255-262; validation/organizations.schemas.ts:26-33; resolvers such as attachOrganizationFromAnnotation derive org from the child row.","im":"Split tenancy: new-org users lose the content; old-org members keep read/write access to a project that now belongs to another organization.","fx":"Make organizationId immutable on update, or migrate all child rows and memberships in one transaction with composite FKs.","vf":"Route test asserting 400 on org change, or integration test checking child-row org ids after a move."},{"id":"API-05","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Deployment","f":"db/migrations/0001_add_project_versions.sql","l":147,"t":"Migrations are not idempotent and take long blocking locks","pr":"0001 claims “safe to run more than once” but has unguarded ADD CONSTRAINTs; 0002 fails on a schema built from db/tables; plain ADD FOREIGN KEY/SET NOT NULL and large single-transaction backfills block writes; two files share number 0003; README says migrations/ is empty.","ev":"0001_add_project_versions.sql:147-153, 171-194; 0002_version_project_consistency.sql:22-47; db/migrations listing.","im":"Failed or blocking deploys; unclear migration order.","fx":"Guard with IF NOT EXISTS checks, use NOT VALID + VALIDATE, batch backfills, renumber and document order.","vf":"Run each migration twice on a scratch DB built from db/tables."},{"id":"API-06","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Performance","f":"db/tables/annotation_comments.sql","l":5,"t":"Missing index on annotation_comments.reply_to_comment_id (ON DELETE SET NULL)","pr":"Each comment delete scans annotation_comments to null out replies.","ev":"annotation_comments.sql:5.","im":"Deleting an annotation with k comments performs ~k sequential scans.","fx":"Partial index on reply_to_comment_id WHERE NOT NULL.","vf":"EXPLAIN ANALYZE the delete."},{"id":"API-07","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Performance","f":"db/tables/stream_events.sql","l":16,"t":"SSE replay index cannot serve the queries that actually run","pr":"Index is (org, project, project_version_id, page_key, event_id) but no caller passes projectVersionId, so queries use `$n IS NULL` and cannot range-scan page_key/event_id.","ev":"stream_events.sql:16-17; events.repo.ts:147-170; annotations.repo.ts:95-104 never sets project_version_id.","im":"SSE connect/replay cost grows with project activity across the retention window.","fx":"Add index (organization_id, project_id, page_key, event_id); populate project_version_id if version filtering is intended.","vf":"EXPLAIN listEventsSince with NULL version."},{"id":"API-08","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Testing","f":"package.json","l":12,"t":"API has no database-backed tests and no test script","pr":"All tests mock the DB (vitest config points DATABASE_URL at an unused port), so no SQL, migration or schema is ever executed; package.json has no `test` script and vitest is not a declared devDependency (present only transitively). Missing coverage: comment PATCH authz, admin cross-project reset, refresh reuse, SSE replay/backpressure, withTransaction, repo-level events/audit, migrations.","ev":"vitest.config.ts; package.json scripts; README mentions npm test.","im":"Schema drift (e.g. the missing audit_log_search_text) and authz regressions go undetected.","fx":"Add `test` script and vitest devDependency; add a Postgres-backed integration suite (e.g. testcontainers) that applies db/tables and migrations.","vf":"CI job running the integration suite against a disposable DB."},{"id":"API-09","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Authentication","f":"src/controllers/auth.controller.ts","l":112,"t":"Refresh tokens are not single-use; old tokens keep working after refresh","pr":"Refresh tokens are stateless JWTs without jti or server record; refresh issues a new token and leaves the presented one valid until idle expiry.","ev":"auth.controller.ts:112-134; utils/jwt.ts:52-69, 177-190.","im":"A leaked refresh token grants an undetectable parallel session until logout/password reset/expiry.","fx":"Store a per-session refresh id/family, rotate on refresh, revoke the family on reuse.","vf":"Refresh with R1 → R2; refresh again with R1 must return 401."},{"id":"API-10","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Authorization","f":"src/controllers/stream.controller.ts","l":70,"t":"Open SSE streams are never re-authorized after revocation","pr":"Ticket, tokenVersion, membership and role are checked only at connect; heartbeats never re-check.","ev":"stream.controller.ts:70-265; analyticsStream.controller.ts:329-436.","im":"After logout, password reset, deactivation or project removal, a client that keeps the connection open continues to receive live project events.","fx":"Close subscriptions on tokenVersion change (publish a revoke event) or re-validate every N heartbeats / cap stream lifetime.","vf":"Open /events, bump token_version, assert the stream closes within one heartbeat."},{"id":"API-11","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Realtime","f":"src/controllers/stream.controller.ts","l":140,"t":"SSE drops events for slow clients without replay or resync","pr":"While paused after `res.write` returns false, events are skipped but `lastSent` still advances; drain only clears `paused`; resync is also skipped while paused.","ev":"stream.controller.ts:140-153, 169-183, 187-192; analyticsStream.controller.ts:132-136 correctly resyncs on drain.","im":"Clients silently miss events and Last-Event-ID replay cannot recover them.","fx":"On drain, replay from the last written id or send `resync`; only advance lastSent for written events.","vf":"Fake res whose write returns false; push events; emit drain; assert replay/resync."},{"id":"API-12","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Authorization","f":"src/middleware/requireActor.ts","l":102,"t":"Cross-organization access returns 401 (client drops session); super_admin is confined to their home org","pr":"requireActorCore loads the actor with `getUser(userId, req.organizationId)`, filtering on the actor's own organization. verifyLogin/listLoginOptions filter the same way.","ev":"requireActor.ts:102-112; users.repo.ts:212-219, 415-425; README/current-workflow describe super_admin as cross lowPins.repo.ts","l":131,"t":"Tag, annotation-tag and flow-pin mutations never publish realtime events","pr":"Contrary to current-workflow §6, these mutations audit but don't publish; StreamEventType has no tag/pin types. renameFlowPin/deleteFlowPin change/delete flows without flow events, while createFlowPin publishes flow.created for a flow the list endpoint excludes.","ev":"flowPins.repo.ts:131-199 (146, 181); annotationTags.repo.ts:91-287, 321; tags.repo.ts:99-239; events.repo.ts:4-24; flows.repo.ts:60, 130.","im":"Tag pins and flow pins don't update live for other viewers; flow-list stream is inconsistent.","fx":"Add event types and publish in each mutation; don't publish flow.created for pinned flows.","vf":"Unit tests in the style of epicFlowEvents.test.ts for each repo."},{"id":"API-16","p":"wec-pinnote-api","s":"Medium","st":"Open","c":"Database","f":"src/repositories/transaction.ts","l":16,"t":"Every rolled-back transaction destroys its pool connection","pr":"`client.release(err instanceof Error ? err : true)` destroys the client even after a successful ROLLBACK and for expected business errors (409 revision conflicts, name/email taken).","ev":"transaction.ts:14-17.","im":"Connection churn (new TCP/TLS per conflict), possible connect timeouts under load.","fx":"Release normally when ROLLBACK succeeds; destroy only when ROLLBACK fails.","vf":"Unit test: release() called without argument after a business error."},{"id":"API-17","p":"wec-pinnote-api","s":"Low","st":"Open","c":"API contract","f":"../wec-pinnote-lib/docs/api-contract.md","l":907,"t":"API contract document has drifted from both client and server","pr":"POST /tags documents a single projectId and single-object response (code uses projectIds[] and { tags }); /events documents bearer auth (code uses POST /events/ticket + ?ticket=); comment create shows authorName (client sends authorId); project create requires projectId (server generates it); org delete “deletes users” (FK is SET NULL); self passw }

function sevPill(s){ return pill(s, "s-"+s); }

function count(pred){ return items.filter(pred).length; }

// ── 1. Overview
(function(){
  var box = el("div",{class:"grid g2"});

  meta.coverage.forEach(function(c){ ul.appendChild(el("li",{},[el("strong",{text:c.p+": "}), c.scope+" — "+c.full+" of "+c.eligible+" eligible files read in full, "+c.partial+" partially, "+c.unopened+" not opened. "+c.note])); });
  o.appendChild(ul);
  o.appendChild(el("h3",{text:"Excluded or not yet reviewed"}));
  var ex = el("ul"); meta.excluded.forEach(function(t){ ex.appendChild(el("li",{text:t})); }); o.appendChild(ex);

// ── 2. Summary
(function(){

    var mine = items.filter(function(i){return i.p===c.p;});
    var mc = mine.filter(function(i){return i.st==="Open";});
    tb.appendChild(el("tr",{},[c.p, mc.length].concat(SEV.map(function(sv){return mc.filter(function(i){return i.s===sv;}).length;})).concat([mine.length-mc.length, c.full+" / "+c.eligible+(c.partial?" (+"+c.partial+" partial)":"")]).map(function(v){return el("td",{text:String(v)});})));
  });
  var tf = meta.coverage.reduce(function(a,c){return a+c.full;},0), te = meta.coverage.reduce(function(a,c){return a+c.eligible;},0), tp = meta.coverage.reduce(function(a,c){return a+c.partial;},0);
  tb.appendChild(el("tr",{},["Total", conf.length].concat(SEV.map(function(sv){return conf.filter(function(i){return i.s===sv;}).length;})).concat([rv.length, tf+" / "+te+" (+"+tp+" partial)"]).map(function(v){return el("td",{},[el("strong",{text:String(v)})]);})));
  t.appendChild(tb); tw.appendChild(t);
  s.appendChild(el("h3",{text:"Per project"})); s.appendChild(tw);
  s.appendChild(el("p",{class:"note",text:"File counting scope: "+meta.countingNote}));
})();

// ── 3. Status
(function(){
  var conf = items.filter(function(i){return i.st==="Open";});
  var ch = conf.filter(function(i){return i.s==="Critical"||i.s==="High";}).length;
  var status = ch ? ["BLOCKED","blocked"] : conf.length ? ["NEEDS ATTENTION","attention"] : ["NO CONFIRMED ISSUES FOUND","clear"];
  var partial = meta.coverage.some(function(c){return c.full < c.eligible;});
  var vr = D.verification.map(function(v){return v.r;}).filter(function(r){return r!=="Not Applicable";});
  var uniq = vr.filter(function(r,i){return vr.indexOf(r)===i;});
  var ver = uniq.length === 1 ? uniq[0] : "Mixed";
  var b = document.getElementById("stBody");
  var row = el("div",{class:"status"});
  row.appendChild(el("span",{class:"pill big "+status[1],text:"Review status: "+status[0]}));
  row.appendChild(el("span",{class:"pill big neutral",text:"Completeness: "+(partial?"Partial":"Complete")}));
  row.appendChild(el("span",{class:"pill big neutral",text:"Verification: "+ver}));
  b.appendChild(row);
  var ul = el("ul");
  ul.appendChild(el("li",{text: ch ? (ch+" confirmed Critical/High issue(s) block release (see action plan, priority P0).") : "No confirmed Critical/High issues."}));
  ul.appendChild(el("li",{text:"Completeness is Partial: 16 barrel files were not opened, 3 files were only partially read, and no browser or database runtime checks were performed."}));
  ul.appendChild(el("li",{text:"Verification is "+ver+": type-checks, API lint/tests and builds passed; library lint/tests and both format checks failed for pre-existing tooling/environment reasons; DB integration and runtime checks were not run."}));
  ul.appendChild(el("li",{text:"This review does not by itself establish production readiness. It covers static review plus the checks listed in section 5 only."}));
  b.appendChild(ul);
})();

// ── 4. Findings
var fSev = document.getElementById("fSev"), fCat = document.getElementById("fCat"), fProj = document.getElementById("fProj"), fStat = document.getElementById("fStat"), q = document.getElementById("q");
SEV.forEach(function(s){ if (items.some(function(i){return i.s===s;})) fSev.appendChild(el("option",{value:s,text:s})); });
items.map(function(i){return i.c;}).filter(function(c,i,a){return a.indexOf(c)===i;}).sort().forEach(function(c){ fCat.appendChild(el("option",{value:c,text:c})); });
meta.projects.forEach(function(p){ fProj.appendChild(el("option",{value:p.name,text:p.name})); });

var list = document.getElementById("fList");
var nodes = items.map(function(i){
  var loc = i.p + "/" + i.f + ":" + i.l;
  var sum = el("summary",{},[
    el("span",{class:"fid",text:i.id}),
    el("span",{class:"sevcol"},[sevPill(i.s)]),
    el("span",{class:"main"},[
      el("div",{class:"ftitle",text:i.t}),
      el("div",{class:"fmeta"},[statPill(i.st), el("span",{text:i.c}), el("span",{class:"loc",text:loc})])
    ])
  ]);
  function blk(h,t){ return el("div",{},[el("h4",{text:h}), el("p",{text:t})]); }
  var body = el("div",{class:"fbody"},[
    blk("Location", loc),
    blk("Problem", i.pr),
    blk("Evidence and triggering conditions", i.ev),
    blk("Impact", i.im),
    blk("Recommended fix", i.fx),
    blk("Suggested verification", i.vf)
  ]);
  var d = el("details",{class:"f",id:"f-"+i.id},[sum, body]);
  d._hay = [i.id,i.t,i.c,i.p,i.f,String(i.l),i.pr,i.ev,i.im,i.fx,i.vf,i.s,i.st].join(" ").toLowerCase();
  d._i = i;
  list.appendChild(d);
  return d;
});
var empty = el("div",{class:"empty",text:"No findings match the current filters."});
list.appendChild(empty);

function apply(){
  var term = q.value.trim().toLowerCase(), n = 0;
  nodes.forEach(function(d){
    var i = d._i;
    var ok = (!fSev.value || i.s===fSev.value) && (!fCat.value || i.c===fCat.value) && (!fProj.value || i.p===fProj.value) && (!fStat.value || i.st===fStat.value) && (!term || d._hay.indexOf(term) !== -1);
    d.hidden = !ok; if (ok) n++;
  });
  empty.hidden = n !== 0;
  var filtered = term || fSev.value || fCat.value || fProj.value || fStat.value;
  document.getElementById("fCount").textContent = filtered
    ? ("Filtered view: showing " + n + " of " + items.length + " findings (overall totals unchanged)")
    : ("Showing all " + items.length + " findings (" + count(function(i){return i.st==="Open";}) + " confirmed + " + count(function(i){return i.st!=="Open";}) + " requiring verification)");
}
[fSev,fCat,fProj,fStat].forEach(function(s){ s.addEventListener("change", apply); });
q.addEventListener("input", apply);
document.getElementById("resetF").addEventListener("click", function(){ q.value=""; fSev.value=fCat.value=fProj.value=fStat.value=""; apply(); });
document.getElementById("expandAll").addEventListener("click", function(){ nodes.forEach(function(d){ if(!d.hidden) d.open = true; }); });
document.getElementById("collapseAll").addEventListener("click", function(){ nodes.forEach(function(d){ d.open = false; }); });
apply();

// ── 5. Verification
(function(){
  var v = document.getElementById("vBody");
  var tw = el("div",{class:"tscroll"}), t = el("table");
  t.appendChild(el("thead",{},[el("tr",{},["Project","Check","Command","Result","Details"].map(function(h){return el("th",{scope:"col",text:h});}))]));
  var tb = el("tbody");
  D.verification.forEach(function(r){
    tb.appendChild(el("tr",{},[el("td",{text:r.p}), el("td",{text:r.name}), el("td",{},[el("code",{text:r.cmd})]), el("td",{},[el("strong",{class:"r-"+r.r.replace(/\s/g,""),text:r.r})]), el("td",{text:r.d})]));
  });
  t.appendChild(tb); tw.appendChild(t); v.appendChild(tw);
  v.appendChild(el("h3",{text:"Pre-existing check failures vs. confirmed code defects"}));
  var ul = el("ul");
  ["Library lint failure: caused by built demo files in example_v2/demo/dist being linted; tracked as a Low tooling finding, not a source defect.",
   "Library DOM test failures: caused by the missing happy-dom install in this checkout (environment). Those tests therefore did not exercise the resolver/presence code; the resolver finding was established by code tracing.",
   "Format-check failures (both repos): mostly CRLF line endings from core.autocrlf=true, plus some real formatting drift; not treated as defects.",
   "CJS entry probe failure: this is a confirmed code/packaging defect and is listed as a finding."].forEach(function(t){ ul.appendChild(el("li",{text:t})); });
  v.appendChild(ul);
  v.appendChild(el("p",{class:"note",text:"All checks were run locally against the working trees. None accessed production services or real data; builds were written to a temporary directory."}));
})();

// ── 6. Action plan
(function(){
  var p = document.getElementById("pBody");
  function link(i){ var a = el("a",{href:"#f-"+i.id,text:i.id}); a.addEventListener("click",function(){ var d=document.getElementById("f-"+i.id); if(d){ d.hidden=false; d.open=true; } }); return a; }
  function group(title, pred, note){
    var g = items.filter(pred); if (!g.length) return;
    p.appendChild(el("h3",{text:title+" ("+g.length+")"}));
    if (note) p.appendChild(el("p",{class:"note",text:note}));
    var ol = el("ol");
    g.forEach(function(i){ ol.appendChild(el("li",{},[link(i), " — ", sevPill(i.s), " ", i.t])); });
    p.appendChild(ol);
  }
  group("P0 — Fix before release: confirmed High", function(i){return i.st==="Open" && (i.s==="Critical"||i.s==="High");}, "Authorization, tenancy and realtime-infrastructure issues on the API first, then the library's host-integration and data-flow defects.");
  group("P1 — Next: confirmed Medium", function(i){return i.st==="Open" && i.s==="Medium";});
  group("P2 — Scheduled: confirmed Low", function(i){return i.st==="Open" && i.s==="Low";});
  group("Verification queue — concerns requiring verification", function(i){return i.st!=="Open";}, "Confirm the deployment, schema or business rule for each item, then promote it to a fix or close it.");
  p.appendChild(el("h3",{text:"Outstanding questions (business rules affecting correctness)"}));
  var ol = el("ol"); meta.questions.forEach(function(t){ ol.appendChild(el("li",{text:t})); }); p.appendChild(ol);
  p.appendChild(el("h3",{text:"Unreviewed areas"}));
  var ul = el("ul"); meta.excluded.concat(["16 one-line barrel index.ts files in the library's annotation components (re-exports only)."]).forEach(function(t){ ul.appendChild(el("li",{text:t})); }); p.appendChild(ul);
})();

// Theme + print
var themeBtn = document.getElementById("themeBtn"), modes = ["auto","light","dark"], mi = 0;
try { var saved = localStorage.getItem("wpn-review-theme"); if (saved && modes.indexOf(saved) > 0){ mi = modes.indexOf(saved); document.documentElement.setAttribute("data-theme", saved); } } catch(e){}
themeBtn.textContent = "Theme: " + modes[mi];
themeBtn.addEventListener("click", function(){
  mi = (mi + 1) % modes.length;
  if (mi === 0) document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", modes[mi]);
  themeBtn.textContent = "Theme: " + modes[mi];
  try { localStorage.setItem("wpn-review-theme", modes[mi]); } catch(e){}
});
var openState = null;
window.addEventListener("beforeprint", function(){ openState = nodes.map(function(d){return d.open;}); nodes.forEach(function(d){ d.open = true; }); });
window.addEventListener("afterprint", function(){ if (openState) nodes.forEach(function(d,k){ d.open = openState[k]; }); });
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
})();
</script>
</body>
</html>
